spring:
  config:
    import: optional:file:./src/main/resources/application-local.yml
    activate:
      on-profile: dev
app:
  billing:
    mode: ${BILLING_MODE:local-sandbox}
    secret: ${BILLING_SECRET:development-only-billing-secret-0123456789}
  auth:
    mail:
      mode: ${AUTH_MAIL_MODE:file}
      secret: ${AUTH_MAIL_SECRET:development-only-auth-mail-secret-0123456789}
  development-subscriptions: false
  development-unlimited-usage: true
logging:
  level:
    com.justinsight.lexiforge: DEBUG
