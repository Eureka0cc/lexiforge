spring:
  config:
    activate:
      on-profile: deepseek
  ai:
    model:
      chat: openai
    openai:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-v4-pro}
          timeout: 40s
          max-retries: 0
          extra-body:
            thinking:
              type: disabled

app:
  ai:
    enabled: true
    provider-structured-output: false
