name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lexiforge_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d lexiforge_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LEXIFORGE_TEST_DB_URL: jdbc:postgresql://localhost:5432/lexiforge_test_ci
      LEXIFORGE_TEST_DB_USERNAME: postgres
      LEXIFORGE_TEST_DB_PASSWORD: postgres
      AI_ENABLED: 'false'
      AI_CHAT_MODEL: none
      AI_LIVE_TEST: 'false'
      AI_SCENE_LIVE_TEST: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend and PostgreSQL integration
        run: mvn -B -Pintegration verify
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem scripts -Filter '*.ps1' -Recurse) {
            $tokens = $null; $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Frontend install and verification
        working-directory: frontend
        run: |
          npm ci
          npm run test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e -- --workers=2
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports
          path: |
            ../tmp/backend/surefire-reports
            ../tmp/backend/failsafe-reports
            ../tmp/playwright
          if-no-files-found: ignore
          retention-days: 7
